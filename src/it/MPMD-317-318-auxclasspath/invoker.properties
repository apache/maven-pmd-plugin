# 1 and 2: includeTests is off; 3 and 4: the includeTests profile adds the test classes and test dependencies
invoker.goals.1 = clean verify
invoker.goals.2 = clean verify -Daggregate=true
invoker.goals.3 = clean verify
invoker.profiles.3 = includeTests
invoker.goals.4 = clean verify -Daggregate=true
invoker.profiles.4 = includeTests
invoker.debug = true
